[[file]]
path = "Cargo.toml"
required = true
forbid_regex = ["TODO", "FIXME"]

[[file]]
path = "src/lib.rs"
required = true
min_size_bytes = 400
forbid_regex = ["TODO", "FIXME", "unimplemented!", "todo!"]

[[file]]
path = "src/main.rs"
required = true
min_size_bytes = 500
forbid_regex = ["TODO", "FIXME", "unimplemented!", "todo!"]

[[file]]
path = "src/complexity.rs"
required = true
min_size_bytes = 1000
forbid_regex = ["TODO", "FIXME", "unimplemented!", "todo!"]

[[file]]
path = "src/daemon.rs"
required = true
min_size_bytes = 1000
forbid_regex = ["TODO", "FIXME", "unimplemented!", "todo!"]

[[file]]
path = "src/notify.rs"
required = true
min_size_bytes = 700
forbid_regex = ["TODO", "FIXME", "unimplemented!", "todo!"]

[[file]]
path = "src/trace.rs"
required = true
min_size_bytes = 1800
forbid_regex = ["TODO", "FIXME", "unimplemented!", "todo!"]

[[file]]
path = "src/ui.rs"
required = true
min_size_bytes = 2000
forbid_regex = ["TODO", "FIXME", "unimplemented!", "todo!"]

[[file]]
path = "README.md"
required = true
require_regex = ["assets/traci-logo.png", "Quick start", "traci check", "traci daemon", "traci complexity", "traci trace", "traci tui", "--production-only", "--apply", "CONTRIBUTING.md", "SECURITY.md", "docs/ROADMAP.md"]

[[file]]
path = "docs/ARCHITECTURE.md"
required = true
require_regex = ["Data flow", "Trust boundaries", "Verification layers"]

[[file]]
path = "docs/ROADMAP.md"
required = true
require_regex = ["Roadmap", "Milestone 1", "Milestone 2", "Milestone 3", "A- definition of done"]

[[file]]
path = "CONTRIBUTING.md"
required = true
require_regex = ["Required gates", "Pull requests"]

[[file]]
path = "SECURITY.md"
required = true
require_regex = ["Report a vulnerability", "Security model"]

[[file]]
path = "kaptaind.toml"
required = true
require_regex = ["cargo test", "enabled = false"]

[[file]]
path = "VERSION"
required = true
require_regex = ["^[0-9]+\\.[0-9]+\\.[0-9]+"]

[[command]]
name = "format"
cmd = ["cargo", "fmt", "--check"]
expect_exit = 0
timeout_secs = 60

[[command]]
name = "logo-asset"
cmd = ["file", "assets/traci-logo.png"]
expect_exit = 0
timeout_secs = 30
stdout_contains = ["PNG image data", "1254 x 1254", "RGBA"]

[[command]]
name = "lint"
cmd = ["cargo", "clippy", "--all-targets", "--", "-D", "warnings"]
expect_exit = 0
timeout_secs = 180

[[command]]
name = "rustdoc"
cmd = ["cargo", "doc", "--no-deps"]
env = { RUSTDOCFLAGS = "-Dwarnings" }
expect_exit = 0
timeout_secs = 180

[[command]]
name = "tests"
cmd = ["cargo", "test", "--all-targets"]
expect_exit = 0
timeout_secs = 180
stdout_contains = ["test result: ok"]

[[command]]
name = "self-check"
cmd = ["cargo", "run", "--quiet", "--", "check", ".", "--production-only", "--fail-on", "warning", "--format", "text"]
expect_exit = 0
timeout_secs = 180

[[command]]
name = "complexity-json"
cmd = ["cargo", "run", "--quiet", "--", "complexity", "src", "--format", "json"]
expect_exit = 0
timeout_secs = 180
stdout_contains = ["\"score\""]

[[command]]
name = "daemon-once"
cmd = ["cargo", "run", "--quiet", "--", "daemon", "run", "src", "--once", "--format", "jsonl"]
expect_exit = 0
timeout_secs = 180
stdout_contains = ["\"event\":\"scan\""]

[[command]]
name = "production-json"
cmd = ["cargo", "run", "--quiet", "--", "check", "src", "--production-only", "--format", "json"]
expect_exit = 0
timeout_secs = 180
stdout_contains = ["\"diagnostics\":[]"]

[[command]]
name = "tui-once"
cmd = ["cargo", "run", "--quiet", "--", "tui", "src", "--production-only", "--once", "--color", "never", "--no-emoji"]
expect_exit = 0
timeout_secs = 180
stdout_contains = ["OBSERVABILITY CONTROL", "PRODUCTION"]

[[command]]
name = "trace-plan"
cmd = ["cargo", "run", "--quiet", "--", "trace", "src", "--goal", "reduce complexity", "--format", "json"]
expect_exit = 0
timeout_secs = 180
stdout_contains = ["\"apply\":false", "\"model\""]

[git]
no_uncommitted_changes = false
no_untracked_files = false
