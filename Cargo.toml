[package]
name = "traci"
version = "0.1.22"
edition = "2021"
rust-version = "1.74"
description = "Pedantic observability enforcement for Rust code"
license = "MIT"
repository = "https://github.com/elci-group/traci"
keywords = ["observability", "tracing", "lint", "telemetry"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "traci"
path = "src/lib.rs"

[[bin]]
name = "traci"
path = "src/main.rs"

[dependencies]
ingauge-gate = { git = "https://github.com/elci-group/ingauge.git", package = "ingauge-gate" }
tokio = { version = "1", default-features = false, features = ["rt"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
