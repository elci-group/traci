name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test --all-targets
      - run: cargo run -- check . --production-only --fail-on warning --color never --no-emoji
      - run: cargo run -- complexity src --format json
      - run: cargo run -- daemon run src --once --format jsonl
      - run: cargo run -- tui src --production-only --once --color never --no-emoji
      - run: cargo run -- trace src --goal "reduce complexity" --format json
